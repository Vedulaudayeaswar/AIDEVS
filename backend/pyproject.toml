[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, bandit (security), warnings
select = ["E", "F", "B", "S", "W"]
ignore = [
  "E501",  # long lines in prompts/templates are intentional
  "S101",  # assert in tests
  "S311",  # random used for jitter/ids in non-crypto contexts only
  "S104",  # binding 0.0.0.0 is required in containers
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603", "S108"]
"agents/*.py" = ["W291", "W293"]  # v1 prompt strings

[tool.pytest.ini_options]
addopts = "-p no:asyncio"
testpaths = ["tests"]
