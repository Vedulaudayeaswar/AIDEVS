# AIDevs — zero-cost Render Blueprint.
#
# Creates ONLY free resources:
#   * aidevs-backend  : Render Web Service, plan: free (spins down after 15 min idle, ~1 min cold start)
#   * aidevs-frontend : Render Static Site (free)
# Deliberately NOT created (they would require payment): Render Postgres, background workers,
# persistent disks, Key Value/Redis. The database is Neon PostgreSQL (free plan, external),
# AI jobs run in a PostgreSQL-backed queue inside the web service, and uploads live in the database.
#
# Secrets to enter in the Render dashboard when creating the Blueprint (never commit them):
#   GROQ_API_KEY  - your Groq free-tier key
#   DATABASE_URL  - Neon connection string (postgresql://...neon.tech/neondb?sslmode=require)
#   ADMIN_EMAILS  - your email (admin console at /admin)
services:
  - type: web
    name: aidevs-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # One gunicorn worker (512 MB free instance). The durable job worker runs in-process.
    startCommand: gunicorn -k gevent -w 1 --worker-connections 100 --timeout 180 --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /api/health/ready
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CORS_ORIGINS
        value: https://aidevs-frontend.onrender.com
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: RUN_WORKER_IN_PROCESS
        value: "1"
      - key: AI_MAX_CONCURRENT_JOBS
        value: "1"
      - key: LOG_FORMAT
        value: json
      # Free-plan fair-use limits (admins can change them at runtime in /admin)
      - key: MAX_PROJECTS_PER_USER
        value: "3"
      - key: AI_GENERATIONS_PER_DAY
        value: "3"
      - key: AI_MODIFICATIONS_PER_DAY
        value: "15"
      - key: EXPORTS_PER_DAY
        value: "10"
      - key: MAX_STORAGE_MB_PER_USER
        value: "50"
      - key: MAX_TOTAL_STORAGE_MB
        value: "300"
      # Platform-wide AI budget per rolling 24h (stay below the Groq free-tier daily limits)
      - key: AI_GLOBAL_DAILY_TOKENS
        value: "350000"
      # Neon free plan: small pool, recycle before scale-to-zero, wait for wake-up at boot
      - key: DB_POOL_SIZE
        value: "3"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_RECYCLE
        value: "240"

  - type: web
    name: aidevs-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        value: https://aidevs-backend.onrender.com
