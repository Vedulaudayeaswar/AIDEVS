name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issue?** Do not file it here - see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected and actual behaviour.
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request ID (from the X-Request-ID response header), if any
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: "Browser, OS, local or Render, commit SHA"
